[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/small_lm_lab"]

[project]
name = "small-lm-lab"
version = "0.1.0"
description = "From-scratch small-LM pretraining lab"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "matplotlib>=3.11.0",
    "mlx>=0.32.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.1",
    "torch>=2.13.0",
    "tqdm>=4.68.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
